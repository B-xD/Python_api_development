services: 
  api: 
      build: .
      depends_on:
          - postgres
      ports: 
          - 4000:8000
      volumes:
          - ./:/usr/src/app:ro
      command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      environment: 
          - DATABASE_HOSTNAME=postgres
          - DATABASE_PORT=5432
          - DATABASE_PASSWORD=belton001
          - DATABASE_NAME=fastapi
          - DATABASE_USERNAME=postgres
          - SECRET_KEY=e78a9ac5d0ed615a0e736dbc2157078ff9ba7785d871327fb6be84746d271e8f
          - ALGORITHM=HS256
          - ACCESS_TOKEN_EXPIRE_MINUTES=60
      

  postgres:
    image: postgres
    environment: 
        - POSTGRES_PASSWORD=belton001
        - POSTGRES_DB=fastapi
    volumes: 
        - postgres-db:/var/lib/postgresql

volumes:
  postgres-db: